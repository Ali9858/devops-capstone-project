[flake8]
max-line-length = 88
exclude = .git,__pycache__,build,dist
per-file-ignores =
    */__init__.py: F401 E402

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True
fail_under = 80

[pylint.'MESSAGES CONTROL']
disable=E1101

[tool:pytest]
pythonpath = .
addopts = --cov=service --cov-report=term-missing --cov-fail-under=80
