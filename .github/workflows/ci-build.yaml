name: CI/CD Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    container:
      image: python:3.9-slim

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    env:
      DATABASE_URI: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/testdb
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc \
            libpq-dev
          rm -rf /var/lib/apt/lists/*

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip wheel

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 nose

      - name: Check code with flake8
        run: |
          flake8 service --count \
            --select=E9,F63,F7,F82 \
            --show-source --statistics

          flake8 service --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics

      - name: Run unit tests with Nose
        run: |
          nosetests --with-coverage
        env:
          DATABASE_URI: ${{ env.DATABASE_URI }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          echo "Build and tests passed."
          echo "Configure your actual deployment commands here."
          # Example:
          # docker build -t your-image:latest .
          # docker push your-registry/your-image:latest
